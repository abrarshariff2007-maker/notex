<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b176ff" />
      <stop offset="100%" stop-color="#7000ff" />
    </linearGradient>
    <linearGradient id="glassFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.3)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.05)" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Glass Rounded Square -->
  <rect x="8" y="8" width="84" height="84" rx="24" fill="url(#glassFace)" stroke="rgba(255, 255, 255, 0.25)" stroke-width="2" />
  
  <!-- Subtle Backing Glow -->
  <circle cx="50" cy="50" r="30" fill="url(#primaryGlow)" opacity="0.25" filter="url(#glow)" />
  
  <!-- Stylized Note Sheet with Folded Corner -->
  <path d="M 28 26 L 58 26 L 72 40 L 72 74 C 72 77 69 80 66 80 L 34 80 C 30 80 28 77 28 74 Z" 
        fill="rgba(15, 23, 42, 0.75)" stroke="url(#primaryGlow)" stroke-width="2" />
  
  <!-- Corner Fold -->
  <path d="M 58 26 L 58 40 L 72 40" fill="none" stroke="url(#primaryGlow)" stroke-width="2" />
  
  <!-- Glowing "X" intersecting "N" -->
  <path d="M 37 46 L 37 68" stroke="url(#primaryGlow)" stroke-width="3" stroke-linecap="round" />
  <path d="M 37 46 L 53 68 L 53 46" stroke="url(#primaryGlow)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 48 50 L 65 66" stroke="url(#purpleGlow)" stroke-width="3.5" stroke-linecap="round" filter="url(#glow)" />
  <path d="M 65 50 L 48 66" stroke="url(#purpleGlow)" stroke-width="3.5" stroke-linecap="round" filter="url(#glow)" />
</svg>
